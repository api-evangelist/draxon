name: Draxon
description: 'Draxon is a Berlin-based company (founded 2025, backed by HV Capital and Point Nine)
  that provides IATA-certified virtual reality training for airport ground handling operations. The
  platform ships pre-configured Meta Quest VR headsets and an immersive training library covering ramp
  equipment such as belt loaders, tractors, pushback tugs, GPUs and towable stairs, plus safety
  procedures and hand signals for frontline ramp personnel. Its Trainer Hub delivers automated,
  IATA-compliant certification tracking with self-paced or instructor-led modules. Draxon operates as a
  B2B SaaS training provider and does not publish a public developer API, SDKs, or API documentation.'
